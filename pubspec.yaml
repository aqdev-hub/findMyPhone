name: find_my_phone
description: "اعثر على هاتفي — تطبيق حماية وتتبع عبر SMS"
publish_to: 'none'
homepage: https://abdulquddus-dev.github.io/project/find-my-phone/
version: 1.1.0+2

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.3.1

  # Permissions & location
  permission_handler: ^12.0.3
  geolocator: ^14.0.1

  # Storage
  flutter_secure_storage: ^10.3.1
  sqflite_sqlcipher: ^3.4.0
  sqflite: ^2.4.2+1
  shared_preferences: ^2.3.3
  path: ^1.9.1
  path_provider: ^2.1.5

  # Security
  crypto: ^3.0.7

  # Maps & URLs
  url_launcher: ^6.3.2
  flutter_map: ^8.1.1
  latlong2: ^0.9.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.3
  battery_plus: ^7.0.0
  device_info_plus: ^13.1.0
  share_plus: 13.2.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/onboarding/
    - assets/branding/

  fonts:
    - family: Tajawal
      fonts:
        - asset: fonts/Tajawal-Regular.ttf
        - asset: fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: fonts/Tajawal-Bold.ttf
          weight: 700
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
        - asset: fonts/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/Poppins-SemiBold.ttf
          weight: 600
