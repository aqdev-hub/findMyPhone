# إعدادات الذاكرة المحسنة والمستقرة لمنع انهيار الـ Daemon
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# تفعيل تشغيل المترجم في عملية منفصلة ومستقرة
kotlin.daemon.jvm.options=-Xmx2G

# الإعدادات الافتراضية لـ Flutter و AndroidX
android.useAndroidX=true
android.builtInKotlin=false
android.newDsl=false

# تسريع البناء عبر السماح للمترجم بالعمل بشكل تزايدي مستقر
kotlin.incremental=false